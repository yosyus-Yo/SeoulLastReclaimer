<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1390" viewBox="0 0 1440 1390"><title>보조 화면과 오류 상태</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#D9793E"/></marker></defs><rect width="100%" height="100%" fill="#F7F6F2"/><g font-family="Apple SD Gothic Neo,Arial,sans-serif" fill="#182733"><text x="50" y="50" font-size="32" fill="#182733">보조 화면과 오류 상태</text><text x="50" y="85" font-size="19" fill="#182733">각 화면은 이전 화면의 선택 상태로 돌아가며 거래와 저장 실패는 명시적으로 안내한다</text><text x="50" y="120" font-size="24" fill="#182733">설정</text><rect x="50" y="140" width="660" height="350" rx="8" fill="#EDF1F2" stroke="#9EADB4" stroke-width="2"/><rect x="85" y="165" width="590" height="40" rx="8" fill="#FFFFFF" stroke="#9EADB4" stroke-width="2"/><text x="102" y="192" font-size="20" fill="#182733">자막 크기  28 / 32 / 40</text><rect x="85" y="213" width="590" height="40" rx="8" fill="#FFFFFF" stroke="#9EADB4" stroke-width="2"/><text x="102" y="240" font-size="20" fill="#182733">화면 흔들림  50%</text><rect x="85" y="261" width="590" height="40" rx="8" fill="#FFFFFF" stroke="#9EADB4" stroke-width="2"/><text x="102" y="288" font-size="20" fill="#182733">섬광 강도  낮음</text><rect x="85" y="309" width="590" height="40" rx="8" fill="#FFFFFF" stroke="#9EADB4" stroke-width="2"/><text x="102" y="336" font-size="20" fill="#182733">회수 입력  누르기 / 토글</text><rect x="85" y="357" width="590" height="40" rx="8" fill="#FFFFFF" stroke="#9EADB4" stroke-width="2"/><text x="102" y="384" font-size="20" fill="#182733">키 매핑  변경</text><rect x="85" y="405" width="590" height="40" rx="8" fill="#FFFFFF" stroke="#9EADB4" stroke-width="2"/><text x="102" y="432" font-size="20" fill="#182733">적용    취소</text><text x="760" y="120" font-size="24" fill="#182733">장비와 인벤토리</text><rect x="760" y="140" width="660" height="350" rx="8" fill="#EDF1F2" stroke="#9EADB4" stroke-width="2"/><rect x="795" y="165" width="590" height="40" rx="8" fill="#FFFFFF" stroke=